name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Git configuration
      run: |
        git config --global safe.directory /home/runner/work/Bank_System/Bank_System

    - name: Configure
      run: ./configure
    
    - name: Build
      run: make
    
    - name: Run checks
      run: make check
    
    - name: Run distcheck
      run: make distcheck

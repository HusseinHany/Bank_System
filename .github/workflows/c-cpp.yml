name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Git configuration
      run: |
        git config --global safe.directory /home/runner/work/Bank_System/Bank_System

    - name: Build
      run: g++ -std=c++17 -Wall -Wextra -pedantic First.cpp -o bank_system
